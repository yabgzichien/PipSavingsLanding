<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Pip is an AI-powered finance companion for receipts, transaction history, bill splitting, net worth, monthly recaps and better money habits."
    />
    <meta name="theme-color" content="#f4f1e8" />
    <script>
      // Apply the saved or system theme before first paint so dark visitors never see a light flash.
      (function () {
        var theme
        try {
          theme = localStorage.getItem('pip-theme')
        } catch (e) {}
        if (theme !== 'light' && theme !== 'dark') {
          theme = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'
        }
        document.documentElement.dataset.theme = theme
        if (theme === 'dark') document.querySelector('meta[name="theme-color"]').setAttribute('content', '#000000')
      })()
    </script>
    <link rel="icon" type="image/png" href="/pip-icon.png" />
    <link rel="canonical" href="https://www.pipsavings.com/" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,400..800;1,400..800&display=swap"
      rel="stylesheet"
    />
    <title>Pip</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
